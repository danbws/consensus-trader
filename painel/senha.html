<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1117">
<title>Senha do painel | Robô de Trade</title>
<link rel="icon" href="/icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>
<script src="/casca.js"></script>
<main class="pagina estreita">
  <header class="cab-pag">
    <h1>Senha do painel</h1>
    <p class="ajuda" id="estado">Carregando.</p>
  </header>
  <div class="cartao">
    <p class="ajuda">É a senha que o celular pede para abrir o robô pelo Tailscale. No computador o painel continua abrindo sem senha. Use uma senha só para isto, com pelo menos 8 caracteres.</p>
    <form id="form" autocomplete="off">
      <label for="s1">Nova senha</label>
      <input id="s1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="s2">Repita a senha</label>
      <input id="s2" type="password" autocomplete="new-password" minlength="8" required>
      <div class="botoes"><button class="principal" type="submit">Salvar senha</button></div>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </div>
  <p class="ajuda" style="margin-top:16px">Esta senha também fica em <a href="/conta#senha">Configurações</a>.</p>
</main>
<script>
const $ = id => document.getElementById(id);
fetch("/api/senha").then(r => r.json()).then(d => {
  $("estado").textContent = d.tem_senha ? "Já existe uma senha. Salvar uma nova troca a senha e desconecta os celulares." : "Ainda não há senha: o celular não consegue entrar até você criar uma.";
});
$("form").onsubmit = async e => {
  e.preventDefault();
  if ($("s1").value !== $("s2").value) { $("msg").textContent = "As duas senhas não são iguais."; $("msg").className = "msg erro"; return; }
  const r = await fetch("/api/senha", { method: "POST", headers: { "X-Painel": "sim", "Content-Type": "application/json" }, body: JSON.stringify({ senha: $("s1").value }) });
  const c = await r.json().catch(() => ({}));
  $("msg").textContent = c.mensagem || c.detail || "Não foi possível salvar."; $("msg").className = "msg " + (r.ok ? "ok" : "erro");
  if (r.ok) { $("s1").value = $("s2").value = ""; $("estado").textContent = "Senha salva."; }
};
</script>
</body>
</html>
