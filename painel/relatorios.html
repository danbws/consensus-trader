<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatórios | Robô de Trade</title>
<link rel="icon" href="/icone.png">
<link rel="apple-touch-icon" href="/icone-180.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robô">
<meta name="theme-color" content="#0D1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<style>
  .layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px; align-items: start; }
  .datas { position: sticky; top: calc(var(--topo) + 16px); display: flex; flex-direction: column; gap: 2px; }
  .datas button { text-align: left; padding: 8px 12px; border: 0; border-radius: var(--raio-b); background: transparent;
                  color: var(--suave); font-weight: 500; min-height: 0; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
  .datas button:hover { background: var(--painel); color: var(--tinta); }
  .datas button[aria-current="true"] { background: var(--painel-2); color: var(--tinta); box-shadow: inset 2px 0 0 var(--acento); }
  article { background: var(--painel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 24px 28px; min-width: 0; line-height: 1.65; }
  article h1 { font-size: 1.5rem; margin: 0 0 12px; }
  article h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  article h3 { font-size: 1rem; margin: 20px 0 6px; }
  article p, article li { max-width: 72ch; }
  article a { overflow-wrap: anywhere; }
  article table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; font-family: var(--mono); font-size: .88rem; font-variant-numeric: tabular-nums; margin: 12px 0; }
  article th, article td { padding: 6px 10px; border-bottom: 1px solid var(--linha); text-align: left; white-space: nowrap; }
  article th { color: var(--suave); font-weight: 500; font-family: var(--texto); }
  article code { font-family: var(--mono); font-size: .9em; background: var(--painel-2); padding: 1px 5px; border-radius: 4px; }
  article blockquote { margin: 12px 0; padding: 2px 16px; border-left: 3px solid var(--linha); color: var(--suave); }
  .vazio-txt { color: var(--suave); }
  @media (max-width: 759px) {
    .layout { grid-template-columns: 1fr; gap: 14px; }
    .datas { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .datas button { white-space: nowrap; }
    article { padding: 18px 16px; }
  }
</style>
</head>
<body>
<script src="/casca.js"></script>
<main class="pagina">
  <header class="cab-pag">
    <h1>Relatórios</h1>
    <p class="ajuda">Um arquivo por dia em docs/relatorios/ (AAAA-MM-DD.md): como o robô está, o que o mercado fez e se ele compraria cada moeda.</p>
  </header>
  <div class="layout">
    <div class="datas" id="datas" role="list" aria-label="Datas"></div>
    <article id="texto"><p class="vazio-txt">Carregando.</p></article>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const nomeData = d => new Date(d + "T12:00").toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });

async function abrir(data) {
  document.querySelectorAll(".datas button").forEach(b => b.setAttribute("aria-current", b.dataset.data === data));
  history.replaceState(null, "", "?data=" + data);
  try {
    const r = await (await fetch("/api/relatorios/" + data)).json();
    $("texto").innerHTML = DOMPurify.sanitize(marked.parse(r.texto));
    $("texto").querySelectorAll("a").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  } catch { $("texto").innerHTML = `<p class="vazio-txt">Não foi possível abrir esse relatório.</p>`; }
}

(async function () {
  let datas = [];
  try { datas = await (await fetch("/api/relatorios")).json(); } catch {}
  if (!datas.length) {
    $("datas").innerHTML = "";
    $("texto").innerHTML = `<p class="vazio-txt">Ainda não há relatórios. Coloque arquivos AAAA-MM-DD.md em docs/relatorios/ para eles aparecerem aqui.</p>`;
    return;
  }
  $("datas").innerHTML = datas.map(d => `<button role="listitem" data-data="${d}">${nomeData(d)}</button>`).join("");
  document.querySelectorAll(".datas button").forEach(b => b.onclick = () => abrir(b.dataset.data));
  const pedida = new URLSearchParams(location.search).get("data");
  abrir(datas.includes(pedida) ? pedida : datas[0]);
})();
</script>
</body>
</html>
